<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>04 回音 · 深空展厅</title>
<link rel="stylesheet" href="frame.css">
<style>
  .col { position: absolute; left: 56px; right: 56px; }

  .now { display: flex; align-items: baseline; justify-content: space-between; }
  .now h2 {
    font-family: var(--serif); font-size: 21px; font-weight: 400;
    letter-spacing: 0.05em; color: var(--ink);
  }
  .now .mini { display: flex; align-items: center; gap: 14px; }

  .item { display: flex; gap: 22px; }
  .item .who {
    font-size: 13px; letter-spacing: 0.06em; color: var(--ink);
  }
  .item .when { font-size: 11px; letter-spacing: 0.20em; color: var(--ink-4); margin-left: 12px; }
  .item .text {
    font-size: 14px; font-weight: 300; line-height: 2.05;
    color: var(--ink-2); margin-top: 12px; max-width: 720px;
  }
  .item .voice { display: flex; align-items: center; gap: 16px; margin-top: 14px; }

  .seam { position: absolute; left: 56px; right: 56px; height: 1px; background: var(--line); }

  .composer {
    position: absolute; left: 56px; right: 56px; bottom: 52px; height: 78px;
    display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--line-2); border-radius: 16px;
    background: rgba(255, 255, 255, 0.018);
    padding: 0 14px 0 30px;
  }
  .composer .ph { font-size: 14px; letter-spacing: 0.06em; color: var(--ink-4); }
  .composer .right { display: flex; align-items: center; gap: 14px; }
  .composer .mic {
    display: inline-flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 26px; border-radius: 999px;
    border: 1px solid var(--brass-2); background: rgba(201, 169, 107, 0.05);
    font-size: 12px; letter-spacing: 0.22em; color: var(--brass);
  }
  .composer .mic em {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--brass);
  }
  .composer .send {
    width: 48px; height: 48px; border-radius: 999px;
    border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--ink-3);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="nebula"></div>
  <div class="stars" id="stars"></div>
  <div class="vignette"></div>

  <header class="topbar">
    <div class="nav"><span>‹ 回到展品</span></div>
    <div class="nav"><span>馆藏 Nº 0247</span></div>
  </header>
  <div class="hairline" style="top:77px;"></div>

  <div class="col now" style="top:126px;">
    <h2>外婆家屋檐下的雨</h2>
    <div class="mini">
      <svg class="trace" id="mini-trace" style="width:190px;height:34px;"></svg>
      <span class="time">00:23 / 00:41</span>
    </div>
  </div>

  <div class="seam" style="top:206px;"></div>
  <p class="label col" style="top:236px;">回音 · 4 条</p>

  <div class="col item" style="top:280px;">
    <div>
      <span class="who">拾荒</span><span class="when">2 小时前</span>
      <p class="text">我外婆家也是这种瓦。下雨的时候声音是脆的，下大了反而闷。</p>
    </div>
  </div>

  <div class="col item" style="top:400px;">
    <div>
      <span class="who">阿柚</span><span class="when">5 小时前</span>
      <div class="voice">
        <div class="play small"><i></i></div>
        <svg class="trace" id="echo-trace" style="width:260px;height:34px;"></svg>
        <span class="time">00:12</span>
      </div>
    </div>
  </div>

  <div class="col item" style="top:512px;">
    <div>
      <span class="who">南山</span><span class="when">昨天</span>
      <p class="text">声音还在，人已经不在了。谢谢你把这一段留下来。</p>
    </div>
  </div>

  <div class="col item" style="top:624px;">
    <div>
      <span class="who">临风</span><span class="when">3 天前</span>
      <p class="text">我录过一段很像的，是外婆家后院的水缸。可惜没留住。</p>
    </div>
  </div>

  <div class="composer">
    <span class="ph">写下你想说的…</span>
    <div class="right">
      <span class="mic"><em></em>说一句</span>
      <div class="send">↑</div>
    </div>
  </div>
</div>

<script src="wave.js"></script>
<script src="check.js"></script>
<script>
  scatterStars('#stars', 150);
  renderTrace(document.getElementById('mini-trace'),
    { seed: 24, w: 190, h: 34, seg: 90, amp: 0.82, progress: 0.56 });
  renderTrace(document.getElementById('echo-trace'),
    { seed: 71, w: 260, h: 34, seg: 120, amp: 0.9, progress: 0 });
  document.querySelector('#echo-trace .lit').setAttribute('d', '');
  document.querySelector('#echo-trace .head').setAttribute('r', '0');
</script>
</body>
</html>
